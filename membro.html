<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=980, initial-scale=1.0"><title>Perfil da Comunidade | Jogos Mods Global</title><link rel="stylesheet" href="style.css"><style>
body{background:#0b1018;color:#e8edf5}.member{max-width:720px;margin:105px auto 50px;padding:16px}.panel{background:#151e2b;border:1px solid #344055;border-radius:12px;padding:16px;margin:12px 0}.member h1,.member h2{color:#5ec8ff}.member input,.member select{width:100%;padding:12px;border:1px solid #344055;border-radius:8px;background:#0e131b;color:white;margin:6px 0}.member button{padding:11px 14px;border:0;border-radius:8px;background:#5ec8ff;color:#07111b;font-weight:800;margin:5px;cursor:pointer}.muted{color:#9eabba;font-size:13px}.modrow{padding:10px 0;border-bottom:1px solid #344055}
</style></head><body><header class="topo"><div class="container"><a class="logo" href="index.html"><h1>Jogos Mods Global</h1><span>Perfil da comunidade</span></a><nav><a href="index.html">Início</a><a href="mods/index.html">Mods</a><a href="enviar-mod.html">Enviar Mod</a></nav></div></header>
<main class="member"><h1>Perfil da comunidade</h1><section class="panel" id="auth"><h2>Entrar ou criar perfil</h2><p class="muted">Use um nome e uma senha. Não é necessário informar e-mail.</p><input id="name" maxlength="24" autocomplete="username" placeholder="Nome de usuário"><input id="pass" type="password" autocomplete="current-password" placeholder="Senha (mínimo 8 caracteres)"><label class="muted">Avatar</label><select id="avatar"><option>🛡️</option><option>⚔️</option><option>🐉</option><option>🧙</option><option>🏹</option><option>🦇</option><option>🐺</option><option>🔥</option><option>❄️</option><option>👑</option><option>💀</option><option>🗡️</option></select><button id="login">Entrar</button><button id="register">Criar perfil</button><p id="msg" class="muted"></p></section>
<section class="panel" id="profile" style="display:none"><h2 id="welcome"></h2><p class="muted">Acompanhe aqui a situação dos seus mods enviados.</p><div id="mine"></div><button id="refresh">Atualizar</button><a href="enviar-mod.html"><button>Enviar novo mod</button></a><button id="logout">Sair</button></section></main>
<script src="mods-api-config.js"></script><script>
(function(){var API=window.PS3MODS_API_URL,token=(localStorage.getItem('ps3member')||sessionStorage.getItem('ps3member')||''), $=function(x){return document.getElementById(x)};if(token)localStorage.setItem('ps3member',token);function msg(t){$('msg').textContent=t}function show(m){$('auth').style.display='none';$('profile').style.display='block';$('welcome').textContent=m.avatar+' '+m.username;load()}
async function enter(kind){try{var b={username:$('name').value.trim(),password:$('pass').value};if(kind==='register')b.avatar=$('avatar').value;if(!b.username||!b.password)throw Error('Informe nome e senha.');var r=await fetch(API+'/api/auth/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;localStorage.setItem('ps3member',token);$('pass').value='';show(d.member);msg('')}catch(e){msg(e.message)}}
async function load(){try{var r=await fetch(API+'/api/auth/my-mods',{headers:{'Authorization':'Bearer '+token}}),d=await r.json();if(!r.ok)throw Error(d.error);$('mine').innerHTML='';if(!d.items.length){$('mine').textContent='Você ainda não enviou mods.';return}d.items.forEach(function(m){var p=document.createElement('div');p.className='modrow';p.textContent=m.nome+' — '+(m.status==='approved'?'Aprovado':m.status==='rejected'?'Rejeitado':'Aguardando aprovação');$('mine').append(p)})}catch(e){msg(e.message)}}
function logout(){token='';localStorage.removeItem('ps3member');$('profile').style.display='none';$('auth').style.display='block';msg('Você saiu do perfil.')}
$('login').onclick=function(){enter('login')};$('register').onclick=function(){enter('register')};$('refresh').onclick=load;$('logout').onclick=logout;if(token){fetch(API+'/api/auth/me',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.json().then(d=>({ok:r.ok,d:d}))).then(x=>x.ok?show(x.d.member):logout()).catch(logout)}
})();
</script></body></html>
