<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Painel ADM | Jogos Mods Global</title><link rel="stylesheet" href="style.css"><style>
body{background:#0b1018;color:#e8edf5}.adm{max-width:1000px;margin:105px auto 50px;padding:16px}.panel{background:#151e2b;border:1px solid #344055;border-radius:12px;padding:16px;margin:12px 0}.adm h1,.adm h2{color:#5ec8ff}.adm input,.adm select{padding:12px;border-radius:8px;border:1px solid #344055;background:#0e131b;color:white;width:100%;max-width:360px;margin:6px 0}.adm button{border:0;border-radius:8px;padding:10px 14px;background:#5ec8ff;color:#07111b;font-weight:800;margin:5px;cursor:pointer}.adm .danger{background:#a83a4b;color:white}.adm .green{background:#267c55;color:white}.mod{border:1px solid #344055;border-radius:10px;padding:14px;margin:12px 0;background:#101722}.mod img{max-width:180px;max-height:140px;object-fit:contain;border-radius:8px}.muted{color:#9eabba;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:6px}.status{margin:10px 0;color:#8bd8ff}.stats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.stats span{background:#0e131b;border:1px solid #344055;border-radius:8px;padding:9px 12px;color:#c8d5e4;font-size:13px}.adm input[type=search]{max-width:100%}.mod h2{font-size:19px}.mod .meta{line-height:1.7}.mod .details{color:#c2ccda;font-size:13px;line-height:1.6;margin:10px 0}.mod a{color:#8bd8ff}
</style></head><body><header class="topo"><div class="container"><a class="logo" href="index.html"><h1>Jogos Mods Global</h1><span>Painel administrativo</span></a><nav><a href="index.html">Voltar ao site</a></nav></div></header>
<main class="adm"><h1>Painel ADM</h1><p><a href="admin-catalogo.html" style="display:inline-block;padding:11px 15px;border-radius:8px;background:#5ec8ff;color:#07111b;font-weight:800;text-decoration:none">✏️ Editar mods antigos do catálogo</a></p><section id="login" class="panel"><h2>Acesso administrativo</h2><input id="password" type="password" placeholder="Senha administrativa" autocomplete="current-password"><br><button id="enter">Entrar</button><p id="login-msg" class="status"></p></section>
<section id="dashboard" style="display:none"><div class="panel"><div class="actions"><input id="search" type="search" placeholder="Buscar por nome, autor, ID ou categoria" aria-label="Buscar mods"><select id="filter"><option value="pending">Aguardando aprovação</option><option value="approved">Aprovados</option><option value="rejected">Rejeitados</option><option value="all">Todos</option></select><button id="refresh">Atualizar lista</button><button id="logout" class="danger">Sair</button></div><div class="stats"><span id="stat-pending">Pendentes: —</span><span id="stat-approved">Aprovados: —</span><span id="stat-rejected">Rejeitados: —</span></div><p id="count" class="muted"></p><p id="message" class="status"></p></div><div id="mods"></div><section class="panel" id="member-panel"><h2>Gerenciar membros</h2><button id="members-refresh">Atualizar membros</button><p class="muted">Remover um membro não apaga os mods que ele já enviou.</p><div id="members-list"></div></section></section></main>
<script src="mods-api-config.js"></script><script src="admin-auth.js"></script><script>
(function(){
var API=window.PS3MODS_API_URL,token=(sessionStorage.getItem('ps3adm')||''),allItems=[], $=function(id){return document.getElementById(id)};localStorage.removeItem('ps3adm');
function message(t){$('message').textContent=t}
async function request(path,opts){opts=opts||{};opts.headers=Object.assign({'Authorization':'Bearer '+token,'Content-Type':'application/json'},opts.headers||{});var r=await fetch(API+path,opts),d=await r.json();if(!r.ok)throw Error(d.error||'Falha na operação');return d}
async function login(){try{await window.PS3AdminAuth.begin(API,$('password').value,async function(t){token=t;sessionStorage.setItem('ps3adm',t);localStorage.removeItem('ps3adm');$('login').style.display='none';$('dashboard').style.display='block';await load();await loadMembers()},function(t){$('login-msg').textContent=t})}catch(e){$('login-msg').textContent=e.message}}

function logout(){token='';localStorage.removeItem('ps3adm');sessionStorage.removeItem('ps3adm');$('dashboard').style.display='none';$('login').style.display='block';$('password').value='';allItems=[]}
function action(id,kind){return async function(){try{if(kind==='delete'&&!confirm('Excluir este mod permanentemente? Esta ação não pode ser desfeita.'))return;await request('/api/admin/mods/'+id+(kind==='delete'?'':'/'+kind),{method:kind==='delete'?'DELETE':'POST',body:kind==='delete'?undefined:'{}'});message('Alteração salva com sucesso.');await load()}catch(e){message(e.message)}}}
async function editMod(m){var nome=prompt('Nome do mod:',m.nome||'');if(nome===null)return;var categoria=prompt('Categoria:',m.categoria||'');if(categoria===null)return;var descricao=prompt('Descrição:',m.descricao||'');if(descricao===null)return;var autor=prompt('Autor original:',m.autor||'');if(autor===null)return;var versao=prompt('Versão:',m.versao||'');if(versao===null)return;var compatibilidade=prompt('Compatibilidade:',m.compatibilidade||'');if(compatibilidade===null)return;var imagem=prompt('Link da imagem de capa:',m.imagem||'');if(imagem===null)return;var raw=prompt('Downloads em JSON (nome e link). Exemplo: [{"nome":"Download","link":"https://..."}]',JSON.stringify(m.downloads||[{nome:'Download',link:m.download||''}]));if(raw===null)return;try{var downloads=JSON.parse(raw);await request('/api/admin/mods/'+m.id,{method:'PATCH',body:JSON.stringify({mod:{nome:nome,categoria:categoria,descricao:descricao,autor:autor,versao:versao,compatibilidade:compatibilidade,imagem:imagem,downloads:downloads}})});message('Mod atualizado.');await load()}catch(e){alert('Não foi possível salvar: '+e.message)}}
async function loadMembers(){try{var d=await request('/api/admin/members'),host=$('members-list');host.innerHTML='';(d.items||[]).forEach(function(m){var row=document.createElement('div');row.className='mod';var label=document.createElement('strong');label.textContent=(m.avatar||'')+' '+m.username+' · ID '+m.id;var date=document.createElement('p');date.className='muted';date.textContent='Criado em: '+(m.created_at||'—');var del=document.createElement('button');del.className='danger';del.textContent='Remover membro';del.onclick=async function(){if(!confirm('Remover a conta '+m.username+'? Os mods enviados por ela serão mantidos.'))return;try{await request('/api/admin/members/'+m.id,{method:'DELETE'});await loadMembers();message('Membro removido.')}catch(e){message(e.message)}};row.append(label,date,del);host.append(row)});if(!(d.items||[]).length)host.textContent='Nenhum membro cadastrado.'}catch(e){message(e.message)}}
function stats(items){$('stat-pending').textContent='Pendentes: '+items.filter(m=>m.status==='pending').length;$('stat-approved').textContent='Aprovados: '+items.filter(m=>!m.status||m.status==='approved').length;$('stat-rejected').textContent='Rejeitados: '+items.filter(m=>m.status==='rejected').length}
function render(){var status=$('filter').value,term=$('search').value.trim().toLocaleLowerCase('pt-BR'),items=allItems.filter(function(m){var ok=status==='all'||(status==='approved'?(!m.status||m.status==='approved'):m.status===status);var hay=[m.id,m.nome,m.autor,m.submittedByName,m.categoria,m.descricao].join(' ').toLocaleLowerCase('pt-BR');return ok&&(!term||hay.includes(term))});$('mods').innerHTML='';$('count').textContent=items.length+' mod(s) exibido(s) de '+allItems.length+' no total';
items.forEach(function(m){var c=document.createElement('article');c.className='mod';var h=document.createElement('h2');h.textContent=m.nome||'Mod sem nome';var p=document.createElement('p');p.className='muted meta';p.textContent='ID '+m.id+' · Enviado por: '+(m.submittedByName||m.autor||'Comunidade')+' · Categoria: '+(m.categoria||'—')+' · Status: '+(m.status||'approved');var desc=document.createElement('p');desc.className='details';desc.textContent=m.descricao||'Sem descrição';var img=document.createElement('img');img.src=m.imagem||'';img.alt=m.nome||'Capa';img.onerror=function(){this.style.display='none'};var detail=document.createElement('details'),sum=document.createElement('summary');sum.textContent='Ver informações e links';var body=document.createElement('div');body.className='details';[['Autor original',m.autor],['Versão',m.versao],['Compatibilidade',m.compatibilidade],['Data',m.data],['Enviado por',m.submittedByName],['Galeria',(m.galeria||[]).length+' imagem(ns)']].forEach(function(x){if(x[1]){var line=document.createElement('p');line.textContent=x[0]+': '+x[1];body.append(line)}});(m.downloads||[{nome:'Download',link:m.download}]).forEach(function(x){if(x.link){var a=document.createElement('a');a.href=x.link;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Abrir '+(x.nome||'download');a.style.display='inline-block';a.style.margin='5px 12px 5px 0';body.append(a)}});detail.append(sum,body);var actions=document.createElement('div');actions.className='actions';if(m.status!=='approved'){var a=document.createElement('button');a.className='green';a.textContent='Aprovar';a.onclick=action(m.id,'approve');actions.append(a)}if(m.status!=='rejected'){var b=document.createElement('button');b.className='danger';b.textContent='Rejeitar';b.onclick=action(m.id,'reject');actions.append(b)}if(m.status==='approved'||m.status==='rejected'){var back=document.createElement('button');back.textContent='Voltar para pendentes';back.onclick=action(m.id,'pending');actions.append(back)}var edit=document.createElement('button');edit.textContent='Editar mod';edit.onclick=function(){editMod(m)};actions.append(edit);var del=document.createElement('button');del.className='danger';del.textContent='Excluir';del.onclick=action(m.id,'delete');actions.append(del);c.append(h,p,desc,img,detail,actions);$('mods').append(c)})}
async function load(){try{var d=await request('/api/admin/mods?status=all');allItems=d.items||[];stats(allItems);render()}catch(e){message(e.message);if(e.message.indexOf('Sessão')>=0)logout()}}
$('enter').onclick=login;$('password').addEventListener('keydown',function(e){if(e.key==='Enter')login()});$('refresh').onclick=load;$('filter').onchange=render;$('search').oninput=render;$('logout').onclick=logout;$('members-refresh').onclick=loadMembers;if(token){$('login').style.display='none';$('dashboard').style.display='block';load();loadMembers()}
})();</script></body></html>
