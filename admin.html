<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel ADM | PS3ModsGlobal</title><link rel="stylesheet" href="style.css"><style>
body{background:#0b1018;color:#e8edf5}.adm{max-width:1000px;margin:105px auto 50px;padding:16px}.panel{background:#151e2b;border:1px solid #344055;border-radius:12px;padding:16px;margin:12px 0}.adm h1,.adm h2{color:#5ec8ff}.adm input,.adm select{padding:12px;border-radius:8px;border:1px solid #344055;background:#0e131b;color:white;width:100%;max-width:360px;margin:6px 0}.adm button{border:0;border-radius:8px;padding:10px 14px;background:#5ec8ff;color:#07111b;font-weight:800;margin:5px;cursor:pointer}.adm .danger{background:#a83a4b;color:white}.adm .green{background:#267c55;color:white}.mod{border:1px solid #344055;border-radius:10px;padding:14px;margin:12px 0;background:#101722}.mod img{max-width:180px;max-height:140px;object-fit:contain;border-radius:8px}.muted{color:#9eabba;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:6px}.status{margin:10px 0;color:#8bd8ff}
</style></head><body><header class="topo"><div class="container"><a class="logo" href="index.html"><h1>PS3ModsGlobal</h1><span>Painel administrativo</span></a><nav><a href="index.html">Voltar ao site</a></nav></div></header>
<main class="adm"><h1>Painel ADM</h1><section id="login" class="panel"><h2>Acesso administrativo</h2><input id="password" type="password" placeholder="Senha administrativa" autocomplete="current-password"><br><button id="enter">Entrar</button><p id="login-msg" class="status"></p></section>
<section id="dashboard" style="display:none"><div class="panel"><div class="actions"><select id="filter"><option value="pending">Aguardando aprovação</option><option value="approved">Aprovados</option><option value="rejected">Rejeitados</option><option value="all">Todos</option></select><button id="refresh">Atualizar lista</button><button id="logout" class="danger">Sair</button></div><p id="count" class="muted"></p><p id="message" class="status"></p></div><div id="mods"></div></section></main>
<script src="mods-api-config.js"></script><script>
(function(){var API=window.PS3MODS_API_URL,token=sessionStorage.getItem('ps3adm')||'', $=function(id){return document.getElementById(id)};function message(t){$('message').textContent=t}
async function request(path,opts){opts=opts||{};opts.headers=Object.assign({'Authorization':'Bearer '+token,'Content-Type':'application/json'},opts.headers||{});var r=await fetch(API+path,opts),d=await r.json();if(!r.ok)throw Error(d.error||'Falha na operação');return d}
async function login(){try{var r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Acesso negado');token=d.token;sessionStorage.setItem('ps3adm',token);$('login').style.display='none';$('dashboard').style.display='block';await load()}catch(e){$('login-msg').textContent=e.message}}
function logout(){token='';sessionStorage.removeItem('ps3adm');$('dashboard').style.display='none';$('login').style.display='block';$('password').value=''}
async function action(id,kind){try{if(kind==='delete'&&!confirm('Excluir este mod permanentemente?'))return;await request('/api/admin/mods/'+id+(kind==='delete'?'':'/'+kind),{method:kind==='delete'?'DELETE':'POST',body:kind==='delete'?undefined:'{}'});message('Alteração salva.');await load()}catch(e){message(e.message)}}
async function load(){try{var d=await request('/api/admin/mods?status='+$('filter').value),host=$('mods');host.innerHTML='';$('count').textContent=(d.items||[]).length+' mod(s)';(d.items||[]).forEach(function(m){var c=document.createElement('article');c.className='mod';var h=document.createElement('h2');h.textContent=m.nome||'Mod sem nome';var p=document.createElement('p');p.className='muted';p.textContent='ID '+m.id+' · Enviado por: '+(m.submittedByName||m.autor||'Comunidade')+' · '+(m.status||'aprovado');var desc=document.createElement('p');desc.textContent=m.descricao||'';var img=document.createElement('img');img.src=m.imagem||'';img.alt=m.nome||'Capa';var actions=document.createElement('div');actions.className='actions';if(m.status!=='approved'){var a=document.createElement('button');a.className='green';a.textContent='Aprovar';a.onclick=function(){action(m.id,'approve')};actions.append(a)}if(m.status!=='rejected'){var b=document.createElement('button');b.className='danger';b.textContent='Rejeitar';b.onclick=function(){action(m.id,'reject')};actions.append(b)}var del=document.createElement('button');del.className='danger';del.textContent='Excluir';del.onclick=function(){action(m.id,'delete')};actions.append(del);c.append(h,p,desc,img,actions);host.append(c)})}catch(e){message(e.message);if(e.message.indexOf('Sessão')>=0)logout()}}
$('enter').onclick=login;$('password').addEventListener('keydown',function(e){if(e.key==='Enter')login()});$('refresh').onclick=load;$('filter').onchange=load;$('logout').onclick=logout;if(token){$('login').style.display='none';$('dashboard').style.display='block';load()}
})();
</script></body></html>
