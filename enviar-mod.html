<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enviar Mod | PS3ModsGlobal</title><link rel="stylesheet" href="style.css"><style>
.form-mod{max-width:850px;margin:110px auto 50px;background:#151a24;border:1px solid #273246;border-radius:12px;padding:26px}.form-mod h1{color:#5ec8ff;margin-bottom:8px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid label{display:block;color:#b7c2d1;font-size:13px;margin-bottom:5px}.form-grid input,.form-grid textarea,.form-grid select{width:100%;padding:11px;border:1px solid #344055;border-radius:7px;background:#0e131b;color:#e8eaed}.form-grid textarea{min-height:110px;resize:vertical}.wide{grid-column:1/-1}.submit-mod{margin-top:18px;padding:13px 24px;border:0;border-radius:7px;background:#5ec8ff;color:#0b0e14;font-weight:800;cursor:pointer}.hint{color:#8b95a5;font-size:12px}.status{margin-top:14px;padding:12px;border-radius:7px;display:none}@media(max-width:650px){.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body>
<header class="topo"><div class="container"><a class="logo" href="index.html"><h1>PS3ModsGlobal</h1><span>Skyrim Legendary Edition</span></a><nav><a href="index.html">Início</a><a href="mods/index.html">Mods</a><a href="enviar-mod.html">Enviar Mod</a><a href="favoritos.html">Favoritos</a></nav></div></header>
<main class="form-mod"><h1>Enviar um Mod</h1><p class="hint">Qualquer visitante pode enviar um mod. Os envios válidos são publicados automaticamente. Use links públicos diretos para imagens e downloads.</p>
<form id="form-mod" class="form-grid">
<input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
<input type="hidden" name="startedAt" id="startedAt">
<div><label>Nome do mod *</label><input name="nome" required minlength="3" maxlength="100"></div>
<div><label>Categoria *</label><select name="categoria" required><option value="">Selecione</option><option>Companions</option><option>Armaduras Masculinas</option><option>Armaduras Femininas</option><option>Armas</option><option>Magias</option><option>Construções e Casas</option><option>Missões e Aventuras</option><option>Gráficos</option><option>Interface/Menu</option><option>Otimização</option><option>Criaturas</option><option>Outros</option></select></div>
<div><label>Autor original</label><input name="autor" maxlength="120"></div><div><label>Versão</label><input name="versao" maxlength="40"></div>
<div><label>Compatibilidade</label><input name="compatibilidade" value="Skyrim Legendary Edition (PS3)" maxlength="120"></div>
<div><label>Data (opcional)</label><input name="data" placeholder="DD/MM/AAAA" maxlength="20"></div>
<div class="wide"><label>Descrição *</label><textarea name="descricao" required minlength="15" maxlength="2500"></textarea></div>
<div><label>URL da imagem de capa *</label><input name="imagem" type="url" required placeholder="https://..."></div>
<div><label>Link principal para download *</label><input name="download" type="url" required placeholder="https://..."></div>
<div class="wide"><label>Galeria (até 8 URLs, uma por linha)</label><textarea name="galeria" placeholder="https://imagem1.jpg&#10;https://imagem2.jpg"></textarea></div>
<div><label>Localização no jogo</label><input name="localizacao" maxlength="180"></div><div><label>Classe / tipo</label><input name="classe" maxlength="100"></div>
<div><label>Gênero</label><input name="genero" maxlength="40" placeholder="Feminino, Masculino, Ambos..."></div><div><label>Casamento</label><select name="casamento"><option value="">Não informado</option><option>Sim</option><option>Não</option></select></div>
<div class="wide"><label>Links adicionais (um por linha, formato: Nome | URL)</label><textarea name="downloads" placeholder="MediaFire | https://..."></textarea></div>
<div class="wide"><button class="submit-mod" type="submit">Publicar mod</button><p id="status" class="status" role="status"></p></div>
</form></main>
<script src="mods-api-config.js"></script><script>
(function(){var f=document.getElementById('form-mod'),started=Date.now();document.getElementById('startedAt').value=started;f.addEventListener('submit',async function(ev){ev.preventDefault();var btn=f.querySelector('button'),s=document.getElementById('status'),d=new FormData(f);btn.disabled=true;btn.textContent='Enviando...';s.style.display='block';s.style.background='#202b39';s.textContent='Enviando seu mod...';var lines=(d.get('downloads')||'').split(/\r?\n/).map(function(x){var p=x.split('|');return p.length>1?{nome:p[0].trim(),link:p.slice(1).join('|').trim()}:null}).filter(Boolean);var payload={startedAt:started,website:d.get('website'),mod:{nome:d.get('nome'),categoria:d.get('categoria'),autor:d.get('autor'),versao:d.get('versao'),compatibilidade:d.get('compatibilidade'),data:d.get('data'),descricao:d.get('descricao'),imagem:d.get('imagem'),download:d.get('download'),galeria:(d.get('galeria')||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),localizacao:d.get('localizacao'),classe:d.get('classe'),genero:d.get('genero'),casamento:d.get('casamento'),downloads:lines}};try{var res=await fetch(window.PS3MODS_API_URL+'/api/mods',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),data=await res.json();if(!res.ok)throw Error(data.error||'Não foi possível publicar');s.style.background='#173526';s.textContent='Mod publicado com sucesso! Obrigado por contribuir com a comunidade.';f.reset();started=Date.now();document.getElementById('startedAt').value=started;}catch(e){s.style.background='#49252b';s.textContent=e.message||'Erro ao enviar. Tente novamente.';}finally{btn.disabled=false;btn.textContent='Publicar mod';}});})();
</script></body></html>
