<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mod da Comunidade | Jogos Mods Global</title><link rel="stylesheet" href="style.css"><style>#community-detail{max-width:950px;margin:110px auto 50px;padding:24px;background:#151a24;border:1px solid #273246;border-radius:12px}#community-detail h1{color:#5ec8ff;margin-bottom:18px}#community-detail h2{color:#5ec8ff;margin:22px 0 10px}.community-cover{width:min(100%,520px);max-height:440px;object-fit:contain;margin:0 auto 20px;border-radius:10px}.community-desc{line-height:1.7;color:#c4ceda;margin:18px 0}.community-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:15px}.community-gallery img{width:100%;height:180px;object-fit:cover;border-radius:8px}</style>
<link rel="stylesheet" href="design-system.css">
</head><body><header class="topo"><div class="container"><a class="logo" href="index.html"><h1>Jogos Mods Global</h1><span>Skyrim Legendary Edition</span></a><nav><a href="index.html">Início</a><a href="mods/index.html">Mods</a><a href="enviar-mod.html">Enviar Mod</a><a href="membro.html">Perfil</a></nav></div></header><main id="community-detail">Carregando mod...</main><div id="community-admin-edit" style="max-width:950px;margin:-30px auto 45px;padding:0 24px;display:none"><a id="community-admin-edit-link" class="download" href="#" style="display:inline-block">✏️ Editar este mod (admin)</a></div><script src="mods-api-config.js"></script><script src="community.js"></script>
<script>
document.addEventListener("DOMContentLoaded",function(){
 var token=sessionStorage.getItem("ps3adm")||localStorage.getItem("ps3adm")||"";
 var box=document.getElementById("community-admin-edit"),link=document.getElementById("community-admin-edit-link");
 var id=new URLSearchParams(location.search).get("id");
 if(!token||!id||!window.PS3MODS_API_URL||!box||!link)return;
 fetch(window.PS3MODS_API_URL+"/api/admin/session",{headers:{"Authorization":"Bearer "+token}})
 .then(function(r){if(!r.ok)throw Error("Sem acesso");return r.json()})
 .then(function(){link.href="admin.html?edit="+encodeURIComponent(id);box.style.display="block"})
 .catch(function(){});
});
</script><script src="monetag-download-gate.js"></script></body></html>
